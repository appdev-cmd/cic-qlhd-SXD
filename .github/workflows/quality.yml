name: Kiểm tra chất lượng
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: appraisal_baseline_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: baseline-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BASELINE_TEST_DATABASE_URL: postgresql://postgres:baseline-test-only@127.0.0.1:5432/appraisal_baseline_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --import tsx scripts/verify_baseline_local.ts
      - run: node --import tsx scripts/verify_node_queue_local.ts
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPRAISAL_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rules:check
      - run: pnpm format:check
      - run: pnpm lint:ui
      - run: pnpm typecheck
      - run: pnpm typecheck:core
      - run: pnpm test:web
      - run: pnpm test:backend:node
      - run: pnpm build
      - name: OpenAPI contract is up to date
        run: |
          node scripts/export_openapi.mjs
          git diff --exit-code docs/api/openapi.json
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    env:
      APPRAISAL_MODE: demo
      APPRAISAL_ENVIRONMENT: demo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm samples:projects
      - name: Start stack (Worker 8200, Core 8201, Web 8208)
        run: |
          pnpm dev > stack.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8208/api/appraisal/runtime && break; sleep 2; done
      - name: Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        run: cat stack.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            output/appraisal/e2e-report
            tests/e2e/test-results
          if-no-files-found: ignore
