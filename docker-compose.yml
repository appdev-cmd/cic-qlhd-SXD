version: '3.9'
name: build-appraisal-ai

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ba-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ba_admin
      POSTGRES_PASSWORD: ba_secret_2026
      POSTGRES_DB: build_appraisal
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ba_admin -d build_appraisal']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ba-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    container_name: ba-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ba_minio
      MINIO_ROOT_PASSWORD: ba_minio_secret
    volumes:
      - minio_data:/data
    command: server /data --console-address ':9001'

volumes:
  pg_data:
  redis_data:
  minio_data:
